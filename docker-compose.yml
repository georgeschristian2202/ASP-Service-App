services:
  # Frontend Nuxt 3
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asp-service-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_API_URL=http://localhost:5000/api
      - NUXT_BACKEND_API_URL=http://backend:5000/api
    depends_on:
      - backend
    networks:
      - asp-network
    restart: unless-stopped

  # Backend API (à configurer selon la stack choisie)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asp-service-backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - NODE_ENV=production
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - JWT_ISSUER=${JWT_ISSUER:-asp-service-api}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-asp-service-admin}
      - JWT_COOKIE_MAX_AGE_MS=${JWT_COOKIE_MAX_AGE_MS:-28800000}
      # Ancienne connexion PostgreSQL locale Docker (secours)
      # - DATABASE_URL=postgresql://asp_user:asp_password@db:5432/asp_service_db
      # Connexion PostgreSQL publique chargee depuis le fichier .env racine
      - DATABASE_URL=${DATABASE_URL:?Definissez DATABASE_URL dans le fichier .env racine}
      - JWT_SECRET=${JWT_SECRET:?Definissez JWT_SECRET dans le fichier .env racine}
      - FRONTEND_URL=${FRONTEND_URL:-https://aspservices.ga}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://aspservices.ga}
      - LOGIN_RATE_LIMIT_WINDOW_MS=${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      - LOGIN_RATE_LIMIT_MAX_REQUESTS=${LOGIN_RATE_LIMIT_MAX_REQUESTS:-5}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-aspservicesgabon@gmail.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Definissez ADMIN_PASSWORD dans le fichier .env racine}
    # Ancienne dependance a la base locale Docker (secours)
    # depends_on:
    #   db:
    #     condition: service_healthy
    networks:
      - asp-network
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads

  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: asp-service-db
    environment:
      - POSTGRES_USER=asp_user
      - POSTGRES_PASSWORD=asp_password
      - POSTGRES_DB=asp_service_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asp_user -d asp_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin pour gérer la base de données (optionnel)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: asp-service-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@aspservice.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - asp-network
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

networks:
  asp-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
