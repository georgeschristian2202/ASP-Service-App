version: '3.8'

services:
  # Frontend Nuxt 3
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asp-service-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_API_URL=http://backend:5000/api
    depends_on:
      - backend
    networks:
      - asp-network
    restart: unless-stopped

  # Backend API (à configurer selon la stack choisie)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asp-service-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://asp_user:asp_password@db:5432/asp_service_db
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - db
    networks:
      - asp-network
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads

  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: asp-service-db
    environment:
      - POSTGRES_USER=asp_user
      - POSTGRES_PASSWORD=asp_password
      - POSTGRES_DB=asp_service_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asp_user -d asp_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin pour gérer la base de données (optionnel)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: asp-service-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@aspservice.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - asp-network
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

networks:
  asp-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
