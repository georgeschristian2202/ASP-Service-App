<!DOCTYPE html>
<html {{ HTML_ATTRS }}>
  <head {{ HEAD_ATTRS }}>
    {{ HEAD }}
    <style>
      /* Masquer complètement l'app Vue au départ */
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      
      #__nuxt {
        display: none !important;
      }
      
      body.vue-ready #__nuxt {
        display: block !important;
      }
      
      /* Loader visible IMMÉDIATEMENT */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }
      
      .loader-spinner {
        position: relative;
        width: 112px;
        height: 112px;
      }
      
      .loader-circle-outer {
        position: absolute;
        inset: 0;
        border: 4px solid #cbd5e1;
        border-top-color: #1e3a5f;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      .loader-circle-inner {
        position: absolute;
        inset: 12px;
        border: 4px solid #fef3c7;
        border-bottom-color: #fbbf24;
        border-radius: 50%;
        animation: spin-reverse 1.5s linear infinite;
      }
      
      .loader-logo {
        position: absolute;
        inset: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .loader-logo img {
        width: 64px;
        height: 64px;
        object-fit: contain;
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes spin-reverse {
        to { transform: rotate(-360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <!-- Loader HTML pur - visible AVANT Vue -->
    <div id="initial-loader">
      <div class="loader-container">
        <div class="loader-spinner">
          <div class="loader-circle-outer"></div>
          <div class="loader-circle-inner"></div>
          <div class="loader-logo">
            <img src="/Logo-ASP-Service-sans fond.png" alt="ASP Services" />
          </div>
        </div>
      </div>
    </div>

    <!-- Application Vue/Nuxt (masquée au départ) -->
    {{ APP }}
    
    <script>
      // Attendre que Vue soit monté
      document.addEventListener('DOMContentLoaded', function() {
        // Attendre un peu que Vue se monte
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          var body = document.body;
          
          // Afficher l'app Vue
          body.classList.add('vue-ready');
          
          // Attendre encore un peu avant de cacher le loader
          setTimeout(function() {
            if (loader) {
              loader.style.transition = 'opacity 0.5s ease-out';
              loader.style.opacity = '0';
              
              setTimeout(function() {
                loader.style.display = 'none';
                body.style.overflow = '';
              }, 500);
            }
          }, 500);
        }, 100);
      });
    </script>
  </body>
</html>
